<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Comfort — Your Pet in AR</title>

<script type="module" src="https://ajax.googleapis.com"></script>
<link href="https://fonts.googleapis.com" rel="stylesheet">

<style>
  :root {
    --warm: #D4845F; --warm-light: #E8A87C; --bg: #0c0906;
    --text: #FBF8F4; --radius: 16px;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; }

  /* 1. MODEL VIEWER CONFIG */
  model-viewer {
    width: 100vw; height: 100dvh;
    background: radial-gradient(circle at center, #1a1510 0%, #0c0906 100%);
  }

  /* 2. UI VISIBILITY LOGIC (AR vs 2D) */
  /* Hide specific UI elements when NOT in AR */
  .ar-only { display: none; }

  /* Show these elements only when WebXR AR session starts */
  model-viewer[ar-status="session-started"] .ar-only {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: absolute;
    bottom: 40px;
    width: 100%;
    pointer-events: none; /* Let clicks pass to buttons */
  }

  /* 3. BUTTON STYLING */
  .btn-container { display: flex; gap: 15px; pointer-events: auto; }
  
  .mood-btn {
    width: 60px; height: 60px; border-radius: 50%;
    border: 3px solid white; background: rgba(0,0,0,0.5);
    font-size: 28px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .bubble {
    background: white; color: black; padding: 10px 20px;
    border-radius: 20px; margin-bottom: 15px; font-weight: bold;
    opacity: 0; transition: opacity 0.3s;
  }
  .bubble.show { opacity: 1; }

  /* Custom AR Button positioning */
  #custom-ar-button {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; background: var(--warm); border: none;
    border-radius: var(--radius); color: white; font-weight: bold;
  }
</style>
</head>
<body>

  <!-- Ensure ar-modes prefers webxr for DOM overlay support -->
  <model-viewer id="pet-model" 
    src="" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    touch-action="pan-y">
    
    <!-- This div and its children will move INTO AR with you -->
    <div class="ar-only">
      <div id="status-bubble" class="bubble">I'm happy!</div>
      <div class="btn-container">
        <button class="mood-btn" onclick="performAction('feed')">🍖</button>
        <button class="mood-btn" onclick="performAction('play')">🧶</button>
        <button class="mood-btn" onclick="performAction('pet')">❤️</button>
      </div>
    </div>

    <button slot="ar-button" id="custom-ar-button">
      ✨ View Pet in Your Room
    </button>
  </model-viewer>

  <!-- Simple Upload for Testing -->
  <div id="upload-ui" style="position:fixed; top:20px; left:20px; z-index:100;">
    <input type="file" id="file-input" accept=".glb,.gltf" onchange="loadModel(event)">
  </div>

<script>
  const mv = document.getElementById('pet-model');
  const bubble = document.getElementById('status-bubble');

  function loadModel(event) {
    const file = event.target.files[0];
    const url = URL.createObjectURL(file);
    mv.src = url;
    document.getElementById('upload-ui').style.display = 'none';
  }

  function performAction(action) {
    const lines = {
      feed: "Yummy! 🍖",
      play: "Catch the yarn! 🧶",
      pet: "I love scritches! ❤️"
    };
    
    bubble.textContent = lines[action];
    bubble.classList.add('show');
    
    // Auto-hide bubble after 2 seconds
    setTimeout(() => bubble.classList.remove('show'), 2000);

    // Optional: Trigger animations if your model has them
    // mv.animationName = action === 'feed' ? 'Eat' : 'Idle';
    // mv.play();
  }
</script>

</body>
</html>
